<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codify - Éditeur de code</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>

<nav class="navbar-ide">
    <div class="container-fluid d-flex align-items-center justify-content-between px-3">
        <a href="/index" class="d-flex align-items-center gap-2" style="color: var(--texte);">
            <div class="icone-logo"><i class="bi bi-code-slash"></i></div>
            <span class="texte-vert" style="font-weight: 700; font-size: 16px;">Codify</span>
        </a>
        <div class="d-flex gap-2">
            <a href="/dashboard" class="btn-nav"><i class="bi bi-speedometer2"></i> Dashboard</a>
            <a href="/exercices" class="btn-nav"><i class="bi bi-journal-code"></i> Exercices</a>
        </div>
    </div>
</nav>

<div class="page-ide">
    <div class="container-fluid px-3">
        <div class="row g-3">
            <div class="col-lg-8">
                <div class="zone-editeur">
                    <div class="barre-editeur">
                        <select id="langage" class="select-langage">
                            <option value="python">Python</option>
                            <option value="java">Java</option>
                            <option value="c">C</option>
                        </select>
                        <div class="d-flex gap-2">
                            <button class="btn-transformer" onclick="transformer()">
                                <i class="bi bi-arrow-left-right"></i> Transformer
                            </button>
                            <button class="btn-executer" onclick="executer()">
                                <i class="bi bi-play-fill"></i> Exécuter
                            </button>
                        </div>
                    </div>
                    <textarea id="codeSource" class="zone-code" spellcheck="false">
# Bienvenue sur Codify !
# Écrivez votre code Python ici

def bonjour(nom):
    """Cette fonction dit bonjour"""
    message = "Bonjour " + nom + " !"
    return message

resultat = bonjour("Codify")
print(resultat)

for i in range(5):
    print("Nombre :", i)
                    </textarea>
                </div>

                <div class="mt-3">
                    <div class="titre-resultat">
                        <i class="bi bi-terminal"></i> Résultat
                    </div>
                    <div id="resultat" class="zone-resultat">En attente d'exécution...</div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="zone-ia">
                    <div class="titre-ia">
                        <i class="bi bi-robot"></i>
                        <span>Assistant IA</span>
                    </div>

                    <div id="messagesIA" class="messages-ia">
                        <div class="message-ia">
                            👋 Bonjour ! Je suis votre assistant Codify. Écrivez du code et cliquez sur <strong>Exécuter</strong>.
                        </div>
                    </div>

                    <div class="input-ia">
                        <input type="text" id="questionIA" class="champ-question"
                            placeholder="Posez une question..."
                            onkeypress="if(event.key === 'Enter') demanderIA()">
                        <button class="btn-envoyer" onclick="demanderIA()">
                            <i class="bi bi-send"></i>
                        </button>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="/js/ide.js"></script>
</body>
</html>
