<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codify - Inscription</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body class="page-centree">

<div class="carte-register">
    <div class="logo-register text-center mb-4">
        <div class="icone-logo"><i class="bi bi-code-slash"></i></div>
        <span class="texte-vert" style="font-weight: 700; font-size: 20px;">Codify</span>
    </div>

    <p class="sous-titre text-center mb-4">Créez votre compte gratuitement</p>

    <!-- Formulaire Spring Boot -->
    <form method="POST" action="/register">
        <!-- Nom complet -->
        <div class="mb-3">
            <label class="champ-label">Nom complet</label>
            <input type="text" name="username" class="champ-input" placeholder="Votre nom" required>
        </div>

        <!-- Email -->
        <div class="mb-3">
            <label class="champ-label">Adresse email</label>
            <input type="email" name="email" class="champ-input" placeholder="exemple@email.com" required>
        </div>

        <!-- Mot de passe -->
        <div class="mb-3">
            <label class="champ-label">Mot de passe</label>
            <input type="password" name="password" class="champ-input" placeholder="Minimum 6 caractères" required minlength="6">
        </div>

        <!-- Niveau -->
        <div class="mb-3">
            <label class="champ-label">Votre niveau</label>
            <select name="level" class="champ-select" required>
                <option value="">-- Choisir un niveau --</option>
                <option value="debutant">🌱 Débutant</option>
                <option value="intermediaire">🔥 Intermédiaire</option>
                <option value="avance">🚀 Avancé</option>
            </select>
        </div>

        <!-- Message d'erreur -->
        <div class="message-erreur mb-3">
            <span th:text="${error}"></span>
        </div>

        <!-- Bouton -->
        <button type="submit" class="btn-valider mt-2">
            <i class="bi bi-person-plus"></i> S'inscrire
        </button>
    </form>

    <p class="lien-bas text-center mt-4 mb-0">
        Déjà un compte ? <a href="/login">Se connecter</a>
    </p>
</div>

</body>
</html>
