<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codify - Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body class="page-centree">

<div class="carte-auth" style="max-width:420px;">

    <!-- Logo admin -->
    <div class="logo-auth" style="margin-bottom:20px;">
        <div class="icone-logo">
            <i class="bi bi-shield-lock-fill"></i>
        </div>
        <span>Admin Codify</span>
    </div>

    <p style="color:#94a3b8;font-size:14px;text-align:center;margin-bottom:24px;">
        Espace réservé aux administrateurs
    </p>

    <!-- Message d'erreur -->
    <div th:if="${erreur}"
         style="background:rgba(231,76,60,0.1);border:1px solid #e74c3c;
         border-radius:8px;padding:10px 14px;color:#e74c3c;font-size:13px;
         margin-bottom:16px;">
        <i class="bi bi-exclamation-circle"></i>
        <span th:text="${erreur}">Erreur</span>
    </div>

    <!-- Formulaire -->
    <form method="POST" action="/admin/login">
        <div class="mb-3">
            <label class="champ-label">Email administrateur</label>
            <input type="email" name="email" class="champ-input"
                   placeholder="admin@codify.com" required>
        </div>
        <div class="mb-3">
            <label class="champ-label">Mot de passe</label>
            <input type="password" name="mdp" class="champ-input"
                   placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-valider">
            <i class="bi bi-shield-check"></i> Accéder au panneau admin
        </button>
    </form>

    <p style="text-align:center;margin-top:16px;">
        <a href="/" style="color:#94a3b8;font-size:13px;text-decoration:none;">
            <i class="bi bi-arrow-left"></i> Retour à l'accueil
        </a>
    </p>

</div>
</body>
</html>
