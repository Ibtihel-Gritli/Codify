<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Codify - Connexion</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div class="page-auth">
    <div class="carte-auth">

        <a href="/" class="retour-lien">
            <i class="bi bi-arrow-left"></i> Retour à l'IDE
        </a>

        <div class="logo-auth">
            <div class="icone-logo"><i class="bi bi-code-slash"></i></div>
            <span>Codify</span>
        </div>

        <!-- Onglets -->
        <div class="onglets-auth">
            <button class="onglet-btn actif" onclick="basculerOnglet('connexion')">Connexion</button>
            <button class="onglet-btn" onclick="basculerOnglet('inscription')">Inscription</button>
        </div>

        <!-- ── Formulaire Connexion ── -->
        <div id="section-connexion" class="formulaire-section actif">
            <form method="POST" action="/login">
                <div class="mb-3">
                    <label class="champ-label">Adresse email</label>
                    <input type="email" name="email" class="champ-input" placeholder="votre@email.com" required>
                </div>
                <div class="mb-3">
                    <label class="champ-label">Mot de passe</label>
                    <div class="champ-password">
                        <input type="password" name="password" id="mdp-login" class="champ-input" placeholder="••••••••" required>
                        <button type="button" class="toggle-password" onclick="toggleMdp('mdp-login', this)">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-valider">
                    <i class="bi bi-box-arrow-in-right"></i> Se connecter
                </button>
            </form>
            <div class="lien-bas">
                Pas encore de compte ?
                <a href="#" onclick="basculerOnglet('inscription')">S'inscrire</a>
            </div>
        </div>

        <!-- ── Formulaire Inscription ── -->
        <div id="section-inscription" class="formulaire-section">
            <form method="POST" action="/register">
                <div class="mb-3">
                    <label class="champ-label">Nom complet</label>
                    <input type="text" name="username" class="champ-input" placeholder="Votre nom" required>
                </div>

                <div class="mb-3">
                    <label class="champ-label">
                        <i class="bi bi-controller" style="color:#00b894"></i>
                        Votre niveau en programmation
                    </label>
                    <div class="niveaux-grid">
                        <label class="niveau-option" onclick="selectionnerNiveau(this, 'debutant')">
                            <input type="radio" name="level" value="debutant" required>
                            <span class="emoji-niveau"></span>
                            <div>
                                <div class="nom-niveau">Débutant</div>
                                <div class="desc-niveau-petit">Je commence à peine</div>
                            </div>
                        </label>
                        <label class="niveau-option" onclick="selectionnerNiveau(this, 'intermediaire')">
                            <input type="radio" name="level" value="intermediaire">
                            <span class="emoji-niveau"></span>
                            <div>
                                <div class="nom-niveau">Intermédiaire</div>
                                <div class="desc-niveau-petit">À l'aise avec les concepts</div>
                            </div>
                        </label>
                        <label class="niveau-option" onclick="selectionnerNiveau(this, 'avance')">
                            <input type="radio" name="level" value="avance">
                            <span class="emoji-niveau"></span>
                            <div>
                                <div class="nom-niveau">Avancé</div>
                                <div class="desc-niveau-petit">Maîtrise solide</div>
                            </div>
                        </label>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="champ-label">Adresse email</label>
                    <input type="email" name="email" class="champ-input" placeholder="votre@email.com" required>
                </div>
                <div class="mb-3">
                    <label class="champ-label">Mot de passe</label>
                    <div class="champ-password">
                        <input type="password" name="password" id="mdp-register" class="champ-input"
                               placeholder="Minimum 6 caractères" required minlength="6">
                        <button type="button" class="toggle-password" onclick="toggleMdp('mdp-register', this)">
                            <i class="bi bi-eye"></i>
                        </button>
                    </div>
                </div>
                <button type="submit" class="btn-valider">
                    <i class="bi bi-person-plus"></i> Créer mon compte
                </button>
            </form>
            <div class="lien-bas">
                Déjà un compte ?
                <a href="#" onclick="basculerOnglet('connexion')">Se connecter</a>
            </div>
        </div>

    </div>
</div>

<script th:inline="javascript">
    const tabInitial = /*[[${tab}]]*/ 'connexion';

    window.onload = function() {
        if (tabInitial === 'inscription') {
            document.querySelectorAll('.onglet-btn')[1].classList.add('actif');
            document.querySelectorAll('.onglet-btn')[0].classList.remove('actif');
            document.getElementById('section-inscription').classList.add('actif');
            document.getElementById('section-connexion').classList.remove('actif');
        }
    };

    function basculerOnglet(onglet) {
        document.querySelectorAll('.onglet-btn').forEach(b => b.classList.remove('actif'));
        document.querySelectorAll('.formulaire-section').forEach(s => s.classList.remove('actif'));
        document.getElementById('section-' + onglet).classList.add('actif');
        event.target.classList.add('actif');
    }

    function selectionnerNiveau(el, niveau) {
        document.querySelectorAll('.niveau-option').forEach(n => n.classList.remove('selectionne'));
        el.classList.add('selectionne');
        el.querySelector('input').checked = true;
    }

    function toggleMdp(id, btn) {
        const input = document.getElementById(id);
        if (input.type === 'password') {
            input.type = 'text';
            btn.innerHTML = '<i class="bi bi-eye-slash"></i>';
        } else {
            input.type = 'password';
            btn.innerHTML = '<i class="bi bi-eye"></i>';
        }
    }
</script>
</body>
</html>
